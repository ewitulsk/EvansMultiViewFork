# MultiView build config — Minecraft 26.3 ("Wilderness Bound").
# Apply via: ./scripts/build-version.sh 26.3
# Uses mojmap directly with noIntermediateMappings().
minecraft_version=26.3
# 26.3 is a stable release artifact, never a beta/pre-release upload.
mod_version=0.6.1
loader_version=0.19.5
fabric_version=0.160.7+26.3
loom_version=1.17-SNAPSHOT

yarn_mappings=
# Flashback 0.44.0 is the local 26.3 port (ewitulsk fork) — no Modrinth release
# exists for 26.3, so the jar is provisioned manually into libs/ (verified by
# file name below; see scripts/download-flashback.sh which is skipped when
# flashback_sha512 is unset).
flashback_version=0.44.0
flashback_filename_pattern=Flashback-${flashback_version}-for-MC26.3.jar

mod_minecraft_dep=>=26.3 <26.4
mod_flashback_dep=>=0.44.0 <0.45
no_intermediate=true
java_version=25
modrinth_game_versions=26.3
