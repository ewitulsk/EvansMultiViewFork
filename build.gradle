plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.gradleup.shadow' version '9.4.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

configurations {
    shadow
}

// noIntermediateMappings is only valid on MC versions where Fabric API ships in mojmap-named
// (e.g. MC 26.1+ where Yarn/Intermediary haven't been published).
if (project.findProperty("no_intermediate") == "true") {
    loom { noIntermediateMappings() }
}

// Forward -Pautoupdate.* Gradle properties to the dev client as -D system properties, so the
// embedded auto-update module can be exercised in-game (e.g. -Pautoupdate.mods.dir=<folder of jars>
// points the scanner at a test folder without loading those jars as mods).
// The hidden-client test framework (src/main/java-testing) depends on the
// renderpearl/SDL3 APIs that landed in MC 26.3 — it is only compiled for >= 26.3
// targets so the older version builds keep working unchanged.
def mcParts = project.minecraft_version.toString().tokenize('.')*.toInteger()
def hiddenClientSupported = mcParts[0] > 26 || (mcParts[0] == 26 && mcParts[1] >= 3)

loom {
    runs {
        client {
            project.properties.each { k, v ->
                if (k.toString().startsWith("autoupdate.")) {
                    vmArg("-D${k}=${v}")
                }
            }
            // Scripted hidden-client test harness (see scripts/Test-ClientSmoke.ps1).
            if (providers.gradleProperty('multiviewClientRunDir').isPresent()) {
                runDir providers.gradleProperty('multiviewClientRunDir').get()
            }
            if (providers.gradleProperty('multiviewClientScenario').isPresent()) {
                vmArg '-Dmultiview.hiddenClient=true'
                vmArg "-Dmultiview.clientScenario=${providers.gradleProperty('multiviewClientScenario').get()}"
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MC 26.1+ ships in mojmap directly (unobfuscated). For older MC versions, we need to
    // remap from obfuscated → mojmap via the official mappings layer.
    if (project.findProperty("no_intermediate") != "true") {
        mappings loom.officialMojangMappings()
    } else {
        // Loom still wants *something* in the mappings configuration even when
        // noIntermediateMappings() is set. Synthesize an empty tiny-mappings jar so
        // configure() doesn't bail out with "Configuration 'mappings' has no dependencies".
        def stubMappingsJar = file("${buildDir}/stub-mappings.jar")
        if (!stubMappingsJar.exists()) {
            stubMappingsJar.parentFile.mkdirs()
            def tinyContent = "tiny\t2\t0\tofficial\tnamed\n"
            new java.util.jar.JarOutputStream(stubMappingsJar.newOutputStream()).withCloseable { jos ->
                def entry = new java.util.jar.JarEntry("mappings/mappings.tiny")
                jos.putNextEntry(entry)
                jos.write(tinyContent.bytes)
                jos.closeEntry()
            }
        }
        mappings files(stubMappingsJar)
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Flashback : no public Maven, consumed from a local jar in libs/
    // (not committed — see .gitignore). Download from https://modrinth.com/mod/flashback
    // Dependency is optional so CI can build without the jar; dev environments
    // that need Flashback compile-time bindings must populate libs/ manually.
    def flashbackJar = file("libs/Flashback-${project.flashback_version}-for-MC${project.minecraft_version}.jar")
    if (flashbackJar.exists()) {
        modCompileOnly files(flashbackJar)
        // Dev-runtime only (NOT bundled in the published jar) so `runClient` can reach
        // Flashback's SelectReplayScreen for manual UI testing. Flashback is not redistributed.
        modLocalRuntime files(flashbackJar)
    } else if (project.findProperty("flashback_sha512")) {
        throw new GradleException("Pinned Flashback dependency is missing: ${flashbackJar.path}. Run ./scripts/download-flashback.sh ${project.minecraft_version}.")
    } else {
        logger.warn("Flashback jar not found at ${flashbackJar.path} — compiling without Flashback API bindings.")
    }

    // Dev-runtime only (NOT bundled): Flashback's JiJ companion libs. Loom does not reliably expose
    // Flashback's nested mixin plugins (mixinconstraints / MixinSquared) when Flashback is consumed
    // as a plain file() dependency, which intermittently crashes `runClient` during mixin apply.
    // Adding them as local-runtime mods makes the dev client boot deterministically. They are never
    // shipped (shadowJar only bundles the `shadow` config). Drop the jars into libs/dev-jij/.
    fileTree(dir: "libs/dev-jij", include: "*.jar").each { jij ->
        modLocalRuntime files(jij)
    }

    // PostHog telemetry SDK — shaded & relocated into the mod jar (see shadowJar below).
    // The published artifact is a self-contained uber-jar (okhttp/kotlin/okio/org.json already
    // bundled under com.posthog.java.shaded.*), so it has no runtime transitive deps.
    shadow "com.posthog.java:posthog:1.2.0"
    implementation "com.posthog.java:posthog:1.2.0"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def modMcDep = project.findProperty("mod_minecraft_dep") ?: ">=${project.minecraft_version}"
    def modFbDep = project.findProperty("mod_flashback_dep") ?: ">=${project.flashback_version}"
    def modJavaDep = ">=" + (project.findProperty('java_version') ?: '21')
    inputs.property "version", project.version
    inputs.property "mod_minecraft_dep", modMcDep
    inputs.property "mod_flashback_dep", modFbDep
    inputs.property "mod_java_dep", modJavaDep
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "mod_minecraft_dep": modMcDep,
            "mod_flashback_dep": modFbDep,
            "mod_java_dep": modJavaDep
        )
        // The testing mixins only exist in >=26.3 builds (see java-testing sourceSet) —
        // register the mixin config there and leave it empty for older targets.
        if (hiddenClientSupported) {
            filter { line -> line.replace('"mixins": []', '"mixins": ["multiview.mixins.json"]') }
        }
    }
}

def javaVersion = (project.findProperty('java_version') ?: '21') as int

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
}

// The MC GUI rendering API changed in 26.1 (GuiGraphics → GuiGraphicsExtractor,
// Screen.render → Screen.extractRenderState, drawCenteredString removed, etc.),
// so we maintain two parallel implementations of the fr/zeffut/multiview/ui
// package and pick the right one at configure time:
//   - src/main/java-classic : MC 1.21.x (GuiGraphics, Screen.render, …)
//   - src/main/java-modern  : MC 26.1+ (GuiGraphicsExtractor, extractRenderState, …)
// MultiViewMod still loads MergeUi via reflection, so the rest of the codebase
// is completely UI-agnostic.
sourceSets.main.java {
    if (project.findProperty("no_intermediate") == "true") {
        srcDir 'src/main/java-modern'
    } else {
        srcDir 'src/main/java-classic'
    }
    // Hidden-client test framework — renderpearl/SDL3 APIs, only on >=26.3 targets.
    if (hiddenClientSupported) {
        srcDir 'src/main/java-testing'
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion.set(JavaLanguageVersion.of(javaVersion))
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

test {
    useJUnitPlatform()
    maxHeapSize = "4G"
    // Forward replay-fixture overrides to the test JVM, e.g.
    //   ./gradlew test -Dmultiview.testReplayZips="a.zip;b.zip" -Dmultiview.testReplayPath=run/replay/foo
    ["multiview.testReplayDir", "multiview.testReplayZips", "multiview.testReplayPath"].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    // Relocate the entire posthog namespace (covers its internally-shaded okhttp/kotlin/okio/org.json
    // which already live under com.posthog.java.shaded.*).
    relocate 'com.posthog.java', 'fr.zeffut.multiview.libs.posthog'
    archiveClassifier = 'dev-shadow'
}

// Loom remaps the *shadowed* jar so the relocated PostHog classes ship inside the final mod jar.
remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}

tasks.named('build') {
    dependsOn shadowJar
}

// Minecraft 26.1+ is built with Loom's noIntermediateMappings() mode. There is
// no intermediary namespace in that mapping tree, so remapping a sources jar
// cannot succeed. The distributable remapped mod jar remains part of `build`;
// omit only the unusable remapped sources artifact for these targets.
if (project.findProperty("no_intermediate") == "true") {
    tasks.named('remapSourcesJar') {
        enabled = false
    }
}

// Export the configured client launch as a standalone spec for scripted test runners.
// Only project-configured environment additions are exported, never the host's environment.
tasks.register('exportTestLaunches') {
    dependsOn 'classes', 'configureClientLaunch', 'fixDevClassTweakers'
    doLast {
        def directory = file(providers.gradleProperty('multiviewLaunchExportDir').get())
        directory.mkdirs()
        def run = tasks.named('runClient').get()
        def javaExecutable = run.javaLauncher.isPresent()
            ? run.javaLauncher.get().executablePath.asFile.absolutePath
            : new File(System.getProperty('java.home'), 'bin/java' + (org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem.isWindows() ? '.exe' : '')).absolutePath
        def command = [javaExecutable]
        // Project-owned scripted processes retain pause evidence beside their normal logs.
        command.add('-Xlog:gc*,safepoint:file=jvm-pauses.log:time,uptime,level,tags:filecount=2,filesize=8M')
        command.addAll(run.allJvmArgs)
        command.addAll(run.jvmArgumentProviders.collectMany { it.asArguments() as List })
        if (!run.classpath.empty) command.addAll(['-cp', run.classpath.asPath])
        command.add(run.mainClass.get())
        if (run.args != null) command.addAll(run.args as List)
        command.addAll(run.argumentProviders.collectMany { it.asArguments() as List })
        // Each exported launch owns its argument files.
        command = command.withIndex().collect { argument, index ->
            if (argument.startsWith('@')) {
                def source = file(argument.substring(1).replaceAll('^"|"$', ''))
                if (!source.isFile()) throw new GradleException('Missing launch argument file: ' + source)
                def snapshot = new File(directory, 'client-arguments-' + index + '.txt')
                snapshot.bytes = source.bytes
                return '@' + snapshot.absolutePath
            }
            return argument
        }
        def runDirectory = providers.gradleProperty('multiviewClientRunDir').map { file(it).absolutePath }.getOrElse(run.workingDir.absolutePath)
        def spec = [command: command, environment: run.environment, directory: runDirectory]
        new File(directory, 'client-launch.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(spec))
    }
}

// ---------------------------------------------------------------------------
// Dev-runtime classTweaker namespace fixup.
//
// Fabric Loader 0.19 validates each mod's *.classtweaker namespace header against the
// runtime namespace. Loom's no-intermediary remap produces official-namespace classes
// but leaves the header token as 'named', so the dev client crashes at boot with
// "Namespace (named) does not match current runtime namespace (official)". On MC 26.x
// there is no intermediary layer at all — 'named' names are the same mojmap names as
// 'official' — so rewriting just the header token in the loom-cache remapped jars
// (recursing into META-INF/jars nested mods) makes the dev runtime accept them.
// This only ever touches the local loom cache, never a published artifact.
// ---------------------------------------------------------------------------
private byte[] fixClassTweakerHeader(byte[] data) {
    String head = new String(data, 0, Math.min(data.length, 64), java.nio.charset.StandardCharsets.UTF_8)
    String text = null
    if (head.startsWith('classTweaker\tv1\tnamed')) {
        text = new String(data, java.nio.charset.StandardCharsets.UTF_8)
                .replaceFirst('classTweaker\tv1\tnamed', 'classTweaker\tv1\tofficial')
    } else if (head.startsWith('accessWidener\tv2\tnamed') || head.startsWith('accessWidener\tv1\tnamed')) {
        text = new String(data, java.nio.charset.StandardCharsets.UTF_8)
                .replaceFirst('(accessWidener\tv[12]\t)named', '$1official')
    }
    return text == null ? null : text.getBytes(java.nio.charset.StandardCharsets.UTF_8)
}

private byte[] fixJarClassTweakers(byte[] input) {
    def zis = new java.util.zip.ZipInputStream(new ByteArrayInputStream(input))
    def out = new ByteArrayOutputStream(input.length + 4096)
    def jos = new java.util.jar.JarOutputStream(out)
    boolean changed = false
    java.util.zip.ZipEntry e
    while ((e = zis.nextEntry) != null) {
        byte[] content = zis.readAllBytes()
        if (e.name.endsWith('.classtweaker') || e.name.endsWith('.accesswidener')) {
            byte[] fixed = fixClassTweakerHeader(content)
            if (fixed != null) { content = fixed; changed = true }
        } else if (e.name.endsWith('.jar')) {
            byte[] fixed = fixJarClassTweakers(content)
            if (fixed != null) { content = fixed; changed = true }
        }
        def ne = new java.util.jar.JarEntry(e.name)
        ne.time = e.time
        jos.putNextEntry(ne)
        jos.write(content)
        jos.closeEntry()
    }
    jos.finish()
    jos.flush()
    return changed ? out.toByteArray() : null
}

tasks.register('fixDevClassTweakers') {
    def loomCacheDir = layout.projectDirectory.dir('.gradle/loom-cache/remapped_mods').asFile
    onlyIf { loomCacheDir.isDirectory() }
    doLast {
        int rewritten = 0
        fileTree(dir: loomCacheDir, include: '**/*.jar').files.each { File jar ->
            byte[] fixed = fixJarClassTweakers(jar.bytes)
            if (fixed != null) {
                jar.bytes = fixed
                rewritten++
            }
        }
        if (rewritten > 0) {
            logger.lifecycle("fixDevClassTweakers: rewrote 'named' -> 'official' headers in {} jar(s)", rewritten)
        }
    }
}
tasks.named('fixDevClassTweakers') { mustRunAfter 'configureClientLaunch' }
tasks.named('runClient') { dependsOn 'fixDevClassTweakers' }
