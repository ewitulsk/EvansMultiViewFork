# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties — targets Minecraft 26.3
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.160.7+26.3
loom_version=1.17-SNAPSHOT

# yarn_mappings is intentionally unset — Loom defaults to mojmap (MC 26.x ships
# unobfuscated; Yarn/Intermediary are not published).
yarn_mappings=
no_intermediate=true
java_version=25

# Flashback (modCompileOnly) — local 26.3 port, provisioned manually into libs/
flashback_version=0.44.0
flashback_filename_pattern=Flashback-${flashback_version}-for-MC26.3.jar

# Version-range deps templated into fabric.mod.json (overridden by versions/*.properties via build-version.sh)
mod_minecraft_dep=>=26.3 <26.4
mod_flashback_dep=>=0.44.0 <0.45

# Mod Properties
mod_version=0.6.1
maven_group=fr.zeffut
archives_base_name=multiview
